[package]
name = "saml"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.91.0"
description = "Stateless, async-native SAML 2.0 toolkit with FIPS-module-backed crypto by default (AWS-LC); no libxml2/xmlsec"
license = "MIT OR Apache-2.0"
repository = "https://github.com/danielkov/saml"
homepage = "https://github.com/danielkov/saml"
documentation = "https://docs.rs/saml"
readme = "README.md"
keywords = ["saml", "sso", "auth", "xml", "security"]
categories = ["authentication", "cryptography"]
exclude = [
    ".DS_Store",
    "**/.DS_Store",
    ".github/",
    ".claude/",
    ".tmp/",
    "examples/idps/",
    "fuzz/",
    "mise.toml",
    # Third-party interop fixtures (ruby-saml, python3-saml, …). Used by the
    # integration tests in CI; no reason to ship megabytes of another
    # project's test data inside the published crate.
    "tests/corpus/",
]

[dependencies]
quick-xml = "0.41"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
base64 = "0.22"
# `sha2` feature deliberately omitted: RSA signing / verification / OAEP go
# through aws-lc-rs under `fips`. Non-FIPS builds (`rustcrypto` feature) use
# the `sha2` crate directly for the digest type parameters.
rsa = { version = "0.9", default-features = false, features = ["std", "pem", "u64_digit"] }
rand = "0.9"
x509-cert = { version = "0.2", features = ["pem"] }
spki = "0.7"
const-oid = "0.9"
pkcs8 = { version = "0.10", features = ["pem"] }
pkcs1 = { version = "0.7", features = ["pem"] }
digest = "0.10"
signature = "2"
thiserror = "2"
http = "1"
url = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
percent-encoding = "2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

# --- RustCrypto primitives: optional, only for non-FIPS builds / specific
# features. None of these are pulled by the Circlip feature set
# (`rsa-sha`, `metadata-emit`, `xsd-validate`, `fips`).
sha1 = { version = "0.10", optional = true, features = ["oid"] }
sha2 = { version = "0.10", optional = true, features = ["oid"] }
hmac = { version = "0.12", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", optional = true }
aes-gcm = { version = "0.10", optional = true }
ecdsa = { version = "0.16", optional = true }
p256 = { version = "0.13", optional = true, features = ["ecdsa", "pem"] }
p384 = { version = "0.13", optional = true, features = ["ecdsa", "pem"] }

# Optional HTTP client (reqwest-client feature only).
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"], optional = true }

# Pinned to match Circlip. `default-features = false` keeps non-FIPS
# `aws-lc-sys` out; `alloc` / `ring-io` / `ring-sig-verify` restore the API
# surface used for verification and key I/O.
aws-lc-rs = { version = "=1.19.0", optional = true, default-features = false, features = ["fips", "alloc", "ring-io", "ring-sig-verify"] }

[features]
# Upstream defaults (FIPS + every optional profile). Circlip uses
# `default-features = false` with `rsa-sha`, `metadata-emit`, `xsd-validate`,
# `fips`.
default = ["reqwest-client", "rsa-sha", "ecdsa-sha", "xmlenc", "slo", "metadata-emit", "xsd-validate", "fips"]
# Pure-RustCrypto implementations (sha2, hmac, aes, aes-gcm, cbc). Required
# whenever `fips` is off; unused (and not compiled) when `fips` is on unless
# another feature needs them.
rustcrypto = ["dep:sha2", "dep:hmac", "dep:aes", "dep:cbc", "dep:aes-gcm"]
reqwest-client = ["dep:reqwest", "dep:rustls", "rustls/ring"]
rsa-sha = []
ecdsa-sha = ["dep:ecdsa", "dep:p256", "dep:p384"]
xmlenc = ["rustcrypto"]
slo = []
metadata-emit = []
artifact-binding = ["dep:sha1"]
idp-disco = []
ecp = []
fips = ["dep:aws-lc-rs", "aws-lc-rs/fips", "rustls?/fips"]
weak-algos = ["dep:sha1"]
xsd-validate = []

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
proptest = "1"
hex = "0.4"

[[test]]
name = "fips_attestation"
path = "tests/fips_attestation.rs"
required-features = ["fips"]

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = -1 }
# `cargo-fuzz` injects `--cfg fuzzing` when building fuzz targets, gating
# `pub mod __fuzz` in lib.rs. Register the cfg name so ordinary builds don't
# warn about it under `unexpected_cfgs`.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(fuzzing)'] }

[lints.clippy]
# Categories
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Pedantic carve-outs (opinionated style nits, not bug classes)
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
single_match_else = "allow"
unreadable_literal = "allow"
too_many_lines = "allow"
struct_field_names = "allow"
items_after_statements = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"

# Restriction: don't panic
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
unchecked_time_subtraction = "deny"

# Restriction: don't fail silently
let_underscore_future = "deny"
let_underscore_must_use = "deny"
unused_result_ok = "deny"
map_err_ignore = "deny"
assertions_on_result_states = "deny"

# Restriction: numeric correctness
arithmetic_side_effects = "deny"
float_cmp = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_precision_loss = "deny"
invalid_upcast_comparisons = "deny"

# Restriction: memory / unsafe hygiene
mem_forget = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_doc = "deny"
unnecessary_safety_comment = "deny"

# Restriction: async footguns
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
if_let_mutex = "deny"
large_futures = "deny"

# Restriction: misc footguns
rc_mutex = "deny"
debug_assert_with_mut_call = "deny"
iter_not_returning_iterator = "deny"
expl_impl_clone_on_copy = "deny"
infallible_try_from = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Force documented suppressions
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
